<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in · Sentinel Security Platform</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"/>
</head><body>
<div class="login-wrap">
  <form class="login-card" method="post">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg></div>
    <h2 style="font-size:20px">Sentinel Security Platform</h2>
    <p class="muted small mb">Enterprise Cybersecurity Assessment &amp; Security Operations</p>
    {% if error %}<div class="notice crit mb">{{ error }}</div>{% endif %}
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}"/>
    <label class="fld">Username</label>
    <input name="username" autofocus autocomplete="username"/>
    <label class="fld" style="margin-top:12px">Password</label>
    <input name="password" type="password" autocomplete="current-password"/>
    <button class="btn primary mt" style="width:100%;justify-content:center">Sign in</button>
    <p class="muted small mt" style="text-align:center">Default demo accounts: admin / analyst / auditor / viewer</p>
  </form>
</div>
</body></html>
